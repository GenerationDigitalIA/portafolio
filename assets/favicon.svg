<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9b51e0"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f2fe" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo oscuro con bordes curvos -->
  <rect width="64" height="64" rx="16" fill="#070913"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#brand-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Logo de Generation DigitalIA (Capas IA con Neón Cian/Púrpura) -->
  <g transform="translate(12, 12)" stroke="url(#brand-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neon-glow)">
    <path d="M20 4L4 12l16 8 16-8-16-8z"/>
